[project]
name = "mllm-football-coach-dataset"
version = "0.1.0"
description = "Reproducible preparation and validation of a SoccerNet coaching-evaluation dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pillow>=10,<13",
    "soccernet==0.1.62",
]

[project.scripts]
soccernet-dataset = "football_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_dataset"]
