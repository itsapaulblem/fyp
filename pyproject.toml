[project]
name = "football-mllm-coach"
version = "0.1.0"
description = "Reproducible evaluation of multimodal models on football recognition and coaching advice"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10.4,<13",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
football-coach = "football_coach.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/football_coach/cli.py" = ["B008"]
